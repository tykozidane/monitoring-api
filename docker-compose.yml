services:
  monitoring-dashboard:
    build: .
    container_name: api-monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./storage/app:/app/storage/app
      - ./log-api:/app/log-api
    restart: always
    env_file:
      - .env
